<nav>
  <!-- Für alle sichtbar -->
  <a routerLink="/products">Products</a>
  <a routerLink="/contact">Contact</a>

  <!-- Nicht eingeloggt -->
  <a *ngIf="!(isLoggedIn$ | async)" routerLink="/login">Login</a>

  <!-- Kunde -->
  <ng-container *ngIf="(isLoggedIn$ | async) && (isCustomer$ | async)">
    <a routerLink="/cart">Cart</a>
    <a routerLink="/customer-dashboard">My Account</a>
    <a routerLink="/customer-orders">My Orders</a>
    <a (click)="logout()">Logout</a>
  </ng-container>

  <!-- Mitarbeiter -->
  <ng-container *ngIf="(isLoggedIn$ | async) && (isEmployee$ | async)">
    <a routerLink="/employee-dashboard">Dashboard</a>
    <a routerLink="/products-admin">Manage Products</a>
    <a routerLink="/orders-admin">Manage Orders</a>
    <a routerLink="/customers-admin">Manage Customers</a>
    <a (click)="logout()">Logout</a>
  </ng-container>
</nav>
