<div class="product-page">
  <button class="back-button" (click)="goBack()">← Zurück</button>
  <button class="cart-button" (click)="goToCart()">🛒 Warenkorb</button>

  <div *ngIf="product; else errorTpl" class="product-content">
    <div class="image-wrapper">
      <img
        [src]="'/assets/images/' + product.image"
        [alt]="product.name"
        class="product-image"
      />
    </div>

    <div class="info-wrapper">
      <h2 class="headline">{{ product.name }}</h2>
      <p><strong>Preis:</strong> {{ product.price | number: '1.2-2' }} €</p>
      <p><strong>Beschreibung:</strong> {{ product.description }}</p>

      <button *ngIf="isCustomer" (click)="addToCart()">
        🛒 Zum Warenkorb hinzufügen
      </button>
    </div>
  </div>

  <ng-template #errorTpl>
    <div class="product-content">
      <p>Produkt nicht gefunden.</p>
    </div>
  </ng-template>

  <div class="recommendation-section" *ngIf="recommendedProducts.length > 0">
    <h3>🌿 Weitere Artikel, die dir gefallen könnten</h3>
    <div class="recommendation-list">
      <div
        *ngFor="let item of recommendedProducts"
        class="recommendation-card"
        (click)="goToProduct(item.product_id)"
      >
        <img [src]="'/assets/images/' + item.image" [alt]="item.name" />
        <h4>{{ item.name }}</h4>
        <p>{{ item.price | number: '1.2-2' }} €</p>
      </div>
    </div>
  </div>
</div>
