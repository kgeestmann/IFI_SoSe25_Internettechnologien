<div *ngIf="product; else errorTpl" class="product-detail-container">
  <h2 class="headline">{{ product?.name }}</h2>

  <img
    [src]="'/assets/images/' + product?.image"
    [alt]="product?.name"
    class="product-image"
  />

  <p><strong>Beschreibung:</strong> {{ product?.description || 'Keine Beschreibung verfügbar.' }}</p>
  <p><strong>Preis:</strong> {{ product?.price | number: '1.2-2' }} €</p>

  <button *ngIf="isCustomer" (click)="addToCart()">Zum Warenkorb hinzufügen</button>
  <p *ngIf="!isCustomer">
    Bitte <a routerLink="/login">einloggen</a>, um dieses Produkt in den Warenkorb zu legen.
  </p>
</div>

<ng-template #errorTpl>
  <p>Produkt nicht gefunden.</p>
</ng-template>
