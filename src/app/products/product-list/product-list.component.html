<h2 class="headline">Produkte</h2>

<div class="products-wrapper">
  <div class="product-card" *ngFor="let product of product">
    <img 
      class="product-image" 
      [src]="'assets/images/' + product.image" 
      [alt]="product.name" 
    />
    <span class="product-name">{{ product.name }}</span>
    <span class="product-price">{{ product.price | number:'1.2-2' }} €</span>
    <button (click)="addToCart(product)">Mehr Details</button>
    <button class="details-button" (click)="goToDetails(product)">Details ansehen</button>
  </div>
</div>
