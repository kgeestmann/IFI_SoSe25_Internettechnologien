<div *ngIf="loading">Lade Produkte...</div>
<div *ngIf="error">{{ error }}</div>

<div *ngIf="!loading && !error">
  <h2>Produkte</h2>
  <div *ngFor="let p of product" class="product-card">
    <span class="product-name">{{ p.name }}</span><br>
    <span class="product-id">ID: {{ p.id }}</span>
  </div>
</div>
