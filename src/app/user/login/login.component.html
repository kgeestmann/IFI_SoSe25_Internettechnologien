<div *ngIf="!(authService.isLoggedIn$ | async)">
  <h2>Login</h2>
  <form (ngSubmit)="onSubmit()">
    <label for="email">E-Mail:</label>
    <input id="email" type="email" [(ngModel)]="email" name="email" required><br><br>
    <label for="password">Passwort:</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" required><br><br>
    <button type="submit">Login</button>
    <div *ngIf="error" style="color:red">{{ error }}</div>
  </form>
  <!--<a class="register-link" routerLink="/registration">Noch kein Account vorhanden?</a>-->
</div>
