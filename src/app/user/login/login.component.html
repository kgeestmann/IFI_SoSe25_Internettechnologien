<h2 class="headline">Login</h2>

<form class="login-form" (ngSubmit)="onLogin()" #f="ngForm">
  <input type="email" name="email" [(ngModel)]="loginModel.email" placeholder="E‑Mail" required>
  <input type="password" name="password" [(ngModel)]="loginModel.password" placeholder="Passwort" required>
  <button type="submit" [disabled]="f.invalid">Login</button>
</form>

<a class="register-link" routerLink="/registration">Noch kein Account vorhanden?</a>
