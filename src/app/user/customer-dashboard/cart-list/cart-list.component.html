<h2 class="headline">
  Mein Warenkorb
</h2>

<div *ngIf="cartItems.length; else emptyCart" class="cart-wrapper">
  <ul class="cart-list">
    <li *ngFor="let item of cartItems" class="cart-item">
      <span class="item-info">
        {{ item.name }}
        {{ item.price | currency:'EUR':'symbol' }}
        <span class="quantity">× {{ item.quantity }}</span>
      </span>

      <button type="button" class="remove-btn">
        Entfernen
      </button>
    </li>
  </ul>

  <div class="summary">
    <div class="total-price">
      Gesamt: {{ totalPrice | currency:'EUR':'symbol' }}
    </div>

    <button type="button" class="order-btn">
      Bestellung&nbsp;aufgeben
    </button>
  </div>

  <button type="button" class="clear-btn">
    Alles löschen
  </button>
</div>

<ng-template #emptyCart>
  <p class="empty-text">Dein Warenkorb ist leer.</p>
</ng-template>
