<h2 class="headline">Warenkorb ({{ cart.itemCount() }} Artikel)</h2>

<!-- Wrapper, nur sichtbar wenn etwas drin ist -->
<div *ngIf="cart.itemCount(); else emptyCart" class="cart-wrapper">
  <ul class="cart-list">
    <li *ngFor="let item of cart.items(); let i = index" class="cart-item">
      <span class="item-info">
        {{ item.product.name }}
        <span class="quantity">× {{ item.quantity }}</span>
      </span>

      <button type="button"
              class="remove-btn"
              (click)="cart.remove(i)">
        Entfernen
      </button>
    </li>
  </ul>

  <button type="button"
          class="clear-btn"
          (click)="cart.clear()">
    Alles löschen
  </button>
</div>

<!-- Leerer Warenkorb -->
<ng-template #emptyCart>
  <p class="empty-text">Dein Warenkorb ist leer.</p>
</ng-template>
