<ng-container *ngIf="!loading && !error; else loadingOrErr">
  <h2 class="headline">Meine Bestellungen</h2>
  
  <div class="orders-wrapper" *ngIf="orders.length; else none">
  <div class="order-card" *ngFor="let order of orders">
    <span class="order-entry">
      <span class="label">Bestell‑ID:</span> {{ order.order_id }}
    </span>
    <span class="order-entry">
      <span class="label">Datum:</span> {{ order.date | date:'dd.MM.yyyy' }}
    </span>
    <span class="order-entry">
      <span class="label">Status:</span> {{ order.delivery_status }}
    </span>
    <span class="order-entry">
      <span class="label">Gesamt:</span> {{ order.total_price }}
    </span>
    <span class="order-entry">
      <span class="label">Zahlung:</span> {{ order.payment_method }}
    </span>
  </div>
</div>


  <ng-template #none>
    <p>Du hast noch keine Bestellungen.</p>
  </ng-template>
</ng-container>

<ng-template #loadingOrErr>
  <p *ngIf="loading">Lade Bestellungen …</p>
  <p *ngIf="error">{{ error }}</p>
</ng-template>
