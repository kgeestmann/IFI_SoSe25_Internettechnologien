<h2 class="headline">Mein Kundenprofil</h2>

<div class="profile-container">
  <ng-container *ngIf="user() as u; else notLoggedIn">
    <p><strong>Vorname:</strong> {{ u.firstname }}</p>
    <p><strong>Nachname:</strong> {{ u.lastname }}</p>
    <p><strong>E-Mail:</strong> {{ u.email }}</p>

    <a class="edit-profile">Profildaten bearbeiten</a>
  </ng-container>

  <ng-template #notLoggedIn>
    <p>Du bist nicht eingeloggt.</p>
  </ng-template>
</div>
