<h2 class="headline">
  <div *ngIf="loading; else elseBlock">Lade Bestellungen...</div>
  <ng-template #elseBlock>Bestellungen</ng-template>
  <div *ngIf="error">{{ error }}</div>
</h2>

<div class="orders-wrapper">
  <div class="order-card" *ngFor="let order of orders" tabindex="0">
    <span class="order-entry">Bestell-ID: {{ order.order_id }}</span>
    <span class="order-entry">Datum: {{ order.date }}</span>
    <span class="order-entry">Kunden-ID: {{ order.customer_id }}</span>
    <span class="order-entry">Status: {{ order.delivery_status }}</span>
    <span class="order-entry">Gesamt: {{ order.total_price | currency: 'EUR' }}</span>
    <span class="order-entry">Zahlung: {{ order.payment_method }}</span>
    <button class="edit-button" (click)="goToEditOrder(order); $event.stopPropagation()">Order bearbeiten</button>
  </div>
</div>
